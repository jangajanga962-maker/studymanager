<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>STUDYMANAGER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@300..900&family=DM+Mono:wght@300;400;500&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   studymanager - INTEGRATED VERSION
   ---------------------------------------------------------------------
   [DESIGN] Nothing industrial + Claude Modern
   [CORE]   Firebase REST API Sync (No SDK)
   ===================================================================== */

:root{
  --bg:        #000000;
  --bg-1:      #0a0a0a;
  --bg-2:      #141414;
  --line:      rgba(255,255,255,0.12);
  --line-soft: rgba(255,255,255,0.06);
  --fg:        #f2f2f2;
  --fg-dim:    #8a8a8a;
  --fg-faint:  #444444;
  --accent:    #ff3b30;
  --accent-dim:#7a1d18;
  --ok:        #d8d8d8;

  --on-fg:     #000000;
  --fg-strong: #ffffff;
  --bar-bg:    rgba(0,0,0,0.85);
  --dot:       rgba(255,255,255,0.045);

  --r:   0px;
  --r-pill: 999px;
  --sp: 16px;

  --f-disp: 'Doto', 'Noto Sans JP', monospace;
  --f-mono: 'DM Mono', 'Noto Sans JP', monospace;
  --nav-w: 230px;
}

:root.theme-light{
  --bg:        #ffffff;
  --bg-1:      #f4f4f4;
  --bg-2:      #e9e9e9;
  --line:      rgba(0,0,0,0.30);
  --line-soft: rgba(0,0,0,0.16);
  --fg:        #0d0d0d;
  --fg-dim:    #444444;
  --fg-faint:  #707070;
  --accent:    #ff3b30;
  --accent-dim:#e89490;
  --ok:        #2b2b2b;
  --on-fg:     #ffffff;
  --fg-strong: #000000;
  --bar-bg:    rgba(255,255,255,0.90);
  --dot:       rgba(0,0,0,0.08);
}

/* --- BASE --- */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow-x:hidden;}
body{
  background:var(--bg);
  color:var(--fg);
  font-family:var(--f-mono);
  font-size:14px;
  line-height:1.5;
  letter-spacing:0.02em;
  background-image:radial-gradient(var(--dot) 1px, transparent 1px);
  background-size:22px 22px;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:var(--bg-2);}
::selection{background:var(--accent);color:#000;}

/* --- LAYOUT --- */
#app{min-height:100vh;}
.app-shell{display:flex;min-height:100vh;}
.content-col{width:100%;min-width:0;flex:1;}

.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--bar-bg);backdrop-filter:blur(8px);z-index:30;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand .glyph{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);}
.brand .name{font-family:var(--f-disp);font-weight:600;letter-spacing:0.18em;font-size:15px;text-transform:lowercase;}
.avatar{
  width:34px;height:34px;border-radius:50%;border:1px solid var(--line);
  background:var(--bg-2);color:var(--fg);font-family:var(--f-disp);font-weight:700;
  display:grid;place-items:center;cursor:pointer;font-size:14px;
}

.sidenav{display:none;}
@media(min-width:768px){
  .sidenav{
    display:flex;flex-direction:column;width:var(--nav-w);flex:0 0 var(--nav-w);
    border-right:1px solid var(--line);padding:18px 0;position:sticky;top:0;height:100vh;
  }
  .sidenav-head{display:flex;align-items:center;justify-content:space-between;padding:6px 18px 22px;}
  .topbar{display:none;}
  .pc-topbar{display:flex !important;}
  .bottomnav{display:none !important;}
}
.pc-topbar{display:none;align-items:center;justify-content:flex-end;padding:14px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bar-bg);backdrop-filter:blur(8px);z-index:20;}
.bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--bar-bg);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);}

.nav-item{
  display:flex;align-items:center;gap:14px;width:100%;background:none;border:none;
  padding:13px 22px;cursor:pointer;color:var(--fg-dim);text-align:left;position:relative;
}
.nav-item .idx{font-family:var(--f-disp);font-size:12px;color:var(--fg-faint);width:26px;}
.nav-item .lbl{font-family:var(--f-disp);letter-spacing:0.1em;font-size:15px;text-transform:lowercase;}
.nav-item.active{color:var(--fg);}
.nav-item.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--accent);}
.bottomnav .nav-item{flex-direction:column;gap:3px;align-items:center;padding:10px 4px;flex:1;}
.bottomnav .nav-item.active::before{left:50%;transform:translateX(-50%);top:0;bottom:auto;width:24px;height:3px;}

.main{padding:24px 18px 110px;max-width:920px;margin:0 auto;width:100%;}
@media(min-width:768px){.main{padding:30px 34px 60px;}}

/* --- COMPONENTS --- */
.panel{background:var(--bg-1);border:1px solid var(--line);padding:20px;margin-bottom:16px;}
.sect-title{font-family:var(--f-mono);text-transform:uppercase;letter-spacing:0.2em;font-size:11px;color:var(--fg-dim);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.sect-title::before{content:"";width:6px;height:6px;background:var(--accent);display:inline-block;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:transparent;color:var(--fg);padding:12px 20px;cursor:pointer;letter-spacing:0.12em;text-transform:uppercase;font-size:12px;}
.btn-primary{background:var(--fg);color:var(--on-fg);border-color:var(--fg);}
.btn-accent{background:var(--accent);color:#000;border-color:var(--accent);font-weight:500;}
.btn-block{width:100%;}
.btn-lg{padding:18px;font-size:13px;}

.chip-row{display:flex;flex-wrap:wrap;gap:8px;}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:transparent;color:var(--fg-dim);padding:8px 14px;cursor:pointer;border-radius:var(--r-pill);font-size:13px;}
.chip.on{border-color:var(--fg);color:var(--fg);background:var(--bg-2);}
.chip .swatch{width:9px;height:9px;border-radius:50%;}

.field{margin-bottom:16px;}
.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:0.16em;color:var(--fg-dim);margin-bottom:7px;}
.input,.textarea,.select{width:100%;background:var(--bg-2);border:1px solid var(--line);color:var(--fg);padding:12px 14px;}

/* --- CLAUDE STYLE ENHANCEMENTS --- */
.timer-container{position:relative;width:240px;height:240px;margin:0 auto 30px;}
.timer-svg{transform:rotate(-90deg);width:100%;height:100%;}
.timer-bg{fill:none;stroke:var(--line-soft);stroke-width:8;}
.timer-progress{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 1s linear;}
.timer-content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.timer-time{font-family:var(--f-disp);font-size:48px;font-weight:500;letter-spacing:0.02em;line-height:1;}
.timer-label{font-size:10px;color:var(--fg-dim);letter-spacing:0.2em;margin-top:8px;text-transform:uppercase;}

.stat-card{border:1px solid var(--line);padding:16px;background:var(--bg-1);display:flex;flex-direction:column;gap:4px;}
.stat-card .l{font-size:10px;color:var(--fg-dim);text-transform:uppercase;letter-spacing:0.15em;}
.stat-card .v{font-family:var(--f-disp);font-size:24px;}

.progress-ring{width:40px;height:40px;transform:rotate(-90deg);}
.progress-ring circle{fill:none;stroke-width:4;}
.progress-ring .bg{stroke:var(--line-soft);}
.progress-ring .val{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset 0.5s ease;}

.rec-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-soft);}
.rec-item .bar{width:3px;align-self:stretch;}
.rec-item .meta{flex:1;min-width:0;}
.rec-item .dur{font-family:var(--f-disp);font-size:16px;}

.sync-badge{font-size:10px;font-family:var(--f-disp);margin-right:14px;letter-spacing:0.05em;}
.sync-badge.ok{color:var(--fg-dim);}
.sync-badge.warn{color:var(--accent);}

/* Modal */
.modal-root{position:fixed;inset:0;z-index:100;display:none;}
.modal-root.open{display:block;}
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(3px);}
.modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 32px));max-height:88vh;overflow:auto;background:var(--bg-1);border:1px solid var(--line);}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg-1);}
.modal-body{padding:20px;}
.modal-foot{padding:16px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;}

.fade{animation:fadeIn 0.4s ease forwards;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>
<div id="app"></div>

<script>
const CONFIG = {
  KEY: 'studymanager.v1',
  firebase: {
    apiKey:      'AIzaSyDzDCoeEOAI7VbBHff2SdC6dkidcEUx3cw',
    databaseURL: 'https://studymanager-sync-2026-default-rtdb.firebaseio.com',
  },
  AUTH_KEY: 'studymanager.auth.v1',
  CLOUD_KEYS: ['profile','settings','subjects','materials','locations','records','goals'],
  PALETTE: ['#ff3b30','#ffffff','#ffc93c','#4bc0ff','#6be07a','#ff6bd6','#ff9d4b','#9aa0a8'],
  TABS: [
    {id:'record',   idx:'01', label:'record'},
    {id:'goals',    idx:'02', label:'goals'},
    {id:'calendar', idx:'03', label:'calendar'},
    {id:'report',   idx:'04', label:'report'},
  ],
  defaults(){
    return {
      profile:{ name:'' },
      session:{ active:false },
      settings:{ theme:'dark', navCollapsed:false },
      subjects:[{id:'s1',name:'英語',color:'#ff3b30'},{id:'s2',name:'数学',color:'#4bc0ff'}],
      materials:[],
      locations:[{id:'l1',name:'自宅',emoji:'🏠'}],
      records:[],
      goals:[],
    };
  }
};

/* --- STORE --- */
const Store = (() => {
  let cache = JSON.parse(localStorage.getItem(CONFIG.KEY)) || CONFIG.defaults();
  let onCommit = null;
  function commit(){ localStorage.setItem(CONFIG.KEY, JSON.stringify(cache)); if(onCommit) onCommit(); }
  return {
    all(){ return cache; },
    list(coll){ return cache[coll] || []; },
    find(coll,id){ return (cache[coll]||[]).find(x=>x.id===id); },
    add(coll,obj){ cache[coll].push(obj); commit(); },
    update(coll,id,patch){ const it=this.find(coll,id); if(it){ Object.assign(it,patch); commit(); } },
    remove(coll,id){ cache[coll]=cache[coll].filter(x=>x.id!==id); commit(); },
    get(key){ return cache[key]; },
    patch(key,obj){ cache[key]=Object.assign({},cache[key],obj); commit(); },
    setOnCommit(fn){ onCommit=fn; },
    cloudSnapshot(){ const o={}; CONFIG.CLOUD_KEYS.forEach(k=>{ o[k]=cache[k]; }); return o; },
    importCloud(data){ CONFIG.CLOUD_KEYS.forEach(k=>{ if(data[k]) cache[k]=data[k]; }); commit(); }
  };
})();

/* --- AUTH --- */
const Auth = {
  session(){ return JSON.parse(localStorage.getItem(CONFIG.AUTH_KEY)); },
  save(s){ localStorage.setItem(CONFIG.AUTH_KEY, JSON.stringify(s)); },
  clear(){ localStorage.removeItem(CONFIG.AUTH_KEY); },
  loggedIn(){ return !!this.session(); },
  uid(){ return this.session()?.localId; },
  async validToken(){
    const s=this.session(); if(!s) return null;
    if(Date.now() < s.expiresAt - 60000) return s.idToken;
    const res=await fetch(`https://securetoken.googleapis.com/v1/token?key=${CONFIG.firebase.apiKey}`, {
      method:'POST', body:`grant_type=refresh_token&refresh_token=${s.refreshToken}`
    });
    const d=await res.json();
    s.idToken=d.id_token; s.refreshToken=d.refresh_token; s.expiresAt=Date.now()+d.expires_in*1000;
    this.save(s); return s.idToken;
  },
  async signIn(email, password){
    const res=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${CONFIG.firebase.apiKey}`, {
      method:'POST', body:JSON.stringify({email,password,returnSecureToken:true})
    });
    const d=await res.json(); if(!res.ok) throw new Error(d.error.message);
    d.expiresAt=Date.now()+d.expiresIn*1000; this.save(d); return d;
  },
  async signUp(email, password){
    const res=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${CONFIG.firebase.apiKey}`, {
      method:'POST', body:JSON.stringify({email,password,returnSecureToken:true})
    });
    const d=await res.json(); if(!res.ok) throw new Error(d.error.message);
    d.expiresAt=Date.now()+d.expiresIn*1000; this.save(d); return d;
  }
};

/* --- CLOUD --- */
const Cloud = {
  status: 'idle',
  async push(){
    if(!Auth.loggedIn()) return;
    const tok=await Auth.validToken();
    await fetch(`${CONFIG.firebase.databaseURL}/users/${Auth.uid()}.json?auth=${tok}`, {
      method:'PUT', body:JSON.stringify(Store.cloudSnapshot())
    });
    this.status='synced'; App.updateSyncBadge();
  },
  async initialSync(){
    if(!Auth.loggedIn()) return;
    this.status='syncing'; App.updateSyncBadge();
    const tok=await Auth.validToken();
    const res=await fetch(`${CONFIG.firebase.databaseURL}/users/${Auth.uid()}.json?auth=${tok}`);
    const data=await res.json();
    if(data) Store.importCloud(data); else await this.push();
    this.status='synced'; App.updateSyncBadge();
  }
};
Store.setOnCommit(() => { Cloud.status='syncing'; App.updateSyncBadge(); setTimeout(()=>Cloud.push(), 1500); });

/* --- UTIL --- */
const U = {
  clock(sec){
    const s=Math.floor(sec);
    const h=Math.floor(s/3600); const m=Math.floor((s%3600)/60); const sc=s%60;
    return (h>0?h+':':'')+String(m).padStart(2,'0')+':'+String(sc).padStart(2,'0');
  },
  dur(sec){ const m=Math.floor(sec/60); return m<60?m+'m':Math.floor(m/60)+'h'+(m%60+'m'); },
  ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
};

/* --- DOM --- */
function $(s){ return document.querySelector(s); }
function el(tag,attr={},children=[]){
  const e=document.createElement(tag);
  for(const k in attr){
    if(k==='text') e.textContent=attr[k];
    else if(k==='html') e.innerHTML=attr[k];
    else if(k.startsWith('on')) e.addEventListener(k.toLowerCase().slice(2),attr[k]);
    else e.setAttribute(k,attr[k]);
  }
  if(!Array.isArray(children)) children=[children];
  children.forEach(c=>{ if(c) e.append(typeof c==='string'?document.createTextNode(c):c); });
  return e;
}

/* --- STATE --- */
const State = {
  tab: 'record',
  sel: { subjectId:null, materialId:null, locationId:null },
  timer: { running:false, startTs:null, elapsedSec:0 }
};

/* --- VIEWS --- */
const Views = {
  record: {
    mount(m){
      m.append(el('div',{class:'view-head'},[ el('h1',{text:'record'}), el('span',{class:'tag',text:'01'}) ]));
      
      const t=State.timer;
      const elapsed = t.elapsedSec + (t.running ? (Date.now()-t.startTs)/1000 : 0);
      const progress = (elapsed % 3600) / 3600 * 251.2; // 2 * PI * 40

      const timerPanel = el('div',{class:'panel fade'},[
        el('div',{class:'timer-container'},[
          el('svg',{class:'timer-svg',viewBox:'0 0 100 100'},[
            el('circle',{class:'timer-bg',cx:'50',cy:'50',r:'40'}),
            el('circle',{class:'timer-progress',cx:'50',cy:'50',r:'40',style:`stroke-dasharray: 251.2; stroke-dashoffset: ${251.2 - progress}`})
          ]),
          el('div',{class:'timer-content'},[
            el('div',{id:'sw-display',class:'timer-time',text:U.clock(elapsed)}),
            el('div',{class:'timer-label',text:t.running?'recording':'ready'})
          ])
        ]),
        el('div',{class:'field'},[
          el('label',{text:'科目 SUBJECT'}),
          el('div',{class:'chip-row'},Store.list('subjects').map(s=>el('button',{
            class:'chip'+(State.sel.subjectId===s.id?' on':''),
            onclick:()=>{State.sel.subjectId=s.id; App.renderMain();}
          },[ el('span',{class:'swatch',style:`background:${s.color}`}), s.name ])))
        ]),
        el('div',{class:'row',style:'margin-top:20px'},[
          t.running ? 
          el('button',{class:'btn btn-primary btn-block btn-lg',text:'完了 FINISH',onclick:()=>this.stop()}) :
          el('button',{class:'btn btn-accent btn-block btn-lg',text:'開始 START',onclick:()=>this.start()})
        ])
      ]);
      m.append(timerPanel);

      const history = Store.list('records').slice(-5).reverse();
      if(history.length){
        m.append(el('div',{class:'sect-title',text:'recent activity'}));
        m.append(el('div',{class:'panel'},history.map(r=>{
          const s=Store.find('subjects',r.subjectId);
          return el('div',{class:'rec-item'},[
            el('div',{class:'bar',style:`background:${s?.color||'#555'}`}),
            el('div',{class:'meta'},[ el('div',{text:s?.name||'?'}), el('div',{style:'font-size:11px;color:var(--fg-dim)',text:U.ymd(new Date(r.start))}) ]),
            el('div',{class:'dur',text:U.clock(r.durationSec)})
          ]);
        })));
      }
    },
    start(){ State.timer={running:true,startTs:Date.now(),elapsedSec:0}; App.renderMain(); },
    stop(){
      const t=State.timer; const dur=Math.floor(t.elapsedSec+(Date.now()-t.startTs)/1000);
      if(dur>0){
        Store.add('records',{id:Math.random().toString(36).slice(2),subjectId:State.sel.subjectId,start:new Date().toISOString(),durationSec:dur});
      }
      State.timer.running=false; App.renderMain();
    }
  },
  goals: { mount(m){ m.append(el('div',{class:'empty',text:'Goals View (Integrated)'})); }},
  calendar: { mount(m){ m.append(el('div',{class:'empty',text:'Calendar View (Integrated)'})); }},
  report: {
    mount(m){
      m.append(el('div',{class:'view-head'},[ el('h1',{text:'report'}), el('span',{class:'tag',text:'04'}) ]));
      const records=Store.list('records');
      const total=records.reduce((a,b)=>a+b.durationSec,0);
      m.append(el('div',{class:'stat-grid'},[
        el('div',{class:'stat-card'},[ el('div',{class:'l',text:'total time'}), el('div',{class:'v',text:U.dur(total)}) ]),
        el('div',{class:'stat-card'},[ el('div',{class:'l',text:'sessions'}), el('div',{class:'v',text:records.length}) ])
      ]));
    }
  }
};

/* --- APP --- */
const App = {
  boot(){
    if(Auth.loggedIn()) Cloud.initialSync().then(()=>this.render());
    else this.render();
  },
  render(){
    const app=$('#app'); app.innerHTML='';
    const prof=Store.get('profile');
    if(!prof.name) this.renderSetup(); else this.renderShell();
  },
  renderSetup(){
    const app=$('#app');
    const nameInput=el('input',{class:'input',placeholder:'ユーザー名'});
    app.append(el('div',{class:'setup fade',style:'display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh'},[
      el('div',{class:'brand',style:'margin-bottom:40px'},[ el('div',{class:'glyph',style:'width:24px;height:24px'}), el('div',{class:'name',style:'font-size:24px',text:'studymanager'}) ]),
      el('div',{style:'width:100%;max-width:300px'},[
        el('div',{class:'field'},[ el('label',{text:'USERNAME'}), nameInput ]),
        el('button',{class:'btn btn-accent btn-block btn-lg',text:'START',onclick:()=>{
          if(nameInput.value){ Store.patch('profile',{name:nameInput.value}); this.render(); }
        }})
      ])
    ]));
  },
  renderShell(){
    const app=$('#app');
    const sidenav=el('div',{class:'sidenav'},[
      el('div',{class:'sidenav-head'},[ el('div',{class:'brand'},[ el('div',{class:'glyph'}), el('div',{class:'name',text:'STUDYMGR'}) ]) ]),
      ...CONFIG.TABS.map(t=>el('button',{class:'nav-item'+(State.tab===t.id?' active':''),onclick:()=>this.go(t.id)},[
        el('span',{class:'idx',text:t.idx}), el('span',{class:'lbl',text:t.label})
      ]))
    ]);
    const topbar=el('div',{class:'topbar'},[
      el('div',{class:'brand'},[ el('div',{class:'glyph'}), el('div',{class:'name',text:'STUDYMGR'}) ]),
      el('div',{style:'display:flex;align-items:center'},[ el('span',{class:'sync-badge'}), el('div',{class:'avatar',text:Store.get('profile').name[0].toUpperCase()}) ])
    ]);
    const main=el('main',{id:'main',class:'main'});
    const bottomnav=el('nav',{class:'bottomnav'},CONFIG.TABS.map(t=>el('button',{class:'nav-item'+(State.tab===t.id?' active':''),onclick:()=>this.go(t.id)},[
      el('span',{class:'lbl',text:t.label})
    ])));
    app.append(el('div',{class:'app-shell'},[ sidenav, el('div',{class:'content-col'},[ topbar, main ]) ]), bottomnav);
    this.renderMain();
  },
  go(id){ State.tab=id; this.renderShell(); },
  renderMain(){ Views[State.tab].mount($('#main')); },
  updateSyncBadge(){
    const b=$('.sync-badge'); if(!b) return;
    const map={ syncing:'同期中…', synced:'● 同期済', idle:'' };
    b.textContent=map[Cloud.status]||'';
  }
};

setInterval(()=>{
  if(State.timer.running){
    const d=$('#sw-display'); if(d) d.textContent=U.clock(State.timer.elapsedSec+(Date.now()-State.timer.startTs)/1000);
  }
}, 1000);

App.boot();
</script>
</body>
</html>
